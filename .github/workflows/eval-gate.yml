name: CI & LLM Evaluation Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-eval:
    name: Test & Evaluate Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis/redis-stack:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]

      - name: Lint and Format Checks (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Unit & Integration Tests
        env:
          REDIS_URL: "redis://localhost:6379"
          AUTH_ENABLED: "false"
          DEFAULT_PROVIDER: "mock"
        run: |
          pytest -v -m "not eval" --cov=app --cov-report=xml --cov-report=term-missing

      - name: Run Golden Dataset Evaluation Gate
        env:
          REDIS_URL: "redis://localhost:6379"
          DEFAULT_PROVIDER: "mock"
        run: |
          python scripts/run_evals.py --threshold 0.80 --dataset tests/eval_golden_dataset.json --output eval_report.json

      - name: Upload Evaluation Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-summary-report
          path: eval_report.json
          retention-days: 14
